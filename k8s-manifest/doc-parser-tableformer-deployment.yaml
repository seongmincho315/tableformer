apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-parser-tableformer-deployment
  namespace: llmops
  labels:
    app: doc-parser-tableformer
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: doc-parser-tableformer
  template:
    metadata:
      labels:
        app: doc-parser-tableformer
    spec:
      serviceAccountName: llmops
      containers:
        - name: doc-parser-tableformer
          image: mncregistry:30500/doc-parser-tableformer:0.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: Asia/Seoul
            - name: PROFILE
              value: prod
            - name: DEVICE
              value: cuda # GPU 노드에 올릴 때는 cuda로 바꾸고 아래 resources.limits 주석 해제
          volumeMounts:
            - name: nfs-root
              mountPath: /nfs-root
          resources:
            limits:
              nvidia.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 30 # CPU 추론(/structure)이 이벤트루프를 오래 막을 수 있어 detr(5s)보다 넉넉하게
      volumes:
        - name: nfs-root
          persistentVolumeClaim:
            claimName: llmops-nfs-root
        - name: license-volume
          secret:
            secretName: llmops-license
        - name: global-configmap
          configMap:
            name: llmops-global-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: doc-parser-tableformer-service
  namespace: llmops
  labels:
    app: doc-parser-tableformer
spec:
  selector:
    app: doc-parser-tableformer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
