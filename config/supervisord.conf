[program:tableformer]
directory=/app
command=/app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8080
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[eventlistener:health_checker]
command=/app/etc/health_checker.sh
events=TICK_60
